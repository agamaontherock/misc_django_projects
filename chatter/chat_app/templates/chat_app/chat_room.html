<html>

<head>
    <title>Room {{ room_id }} - Chatter</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logout-btn {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            color: #f8fafc;
            border-color: #f8fafc;
            background-color: #334155;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            background-color: #1e293b;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            max-width: 70%;
            align-self: flex-start;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.25rem;
        }

        .message-user {
            font-weight: 600;
            font-size: 0.875rem;
            color: #38bdf8;
        }

        .message-time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .message-text {
            font-size: 0.9375rem;
            line-height: 1.5;
            color: #f1f5f9;
            word-break: break-word;
        }

        #chat-input {
            background-color: #1e293b;
            padding: 1.5rem 2rem;
            display: flex;
            gap: 1rem;
            border-top: 1px solid #334155;
        }

        #chat-message-input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #f8fafc;
            outline: none;
        }

        #chat-message-input:focus {
            border-color: #38bdf8;
        }

        #chat-message-submit {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<script>
    document.addEventListener("DOMContentLoaded", (event) => {
        const room_id = "{{ room_id }}";
        const url = 'ws://' + window.location.host + '/ws/chat/room/' + room_id + '/';
        const chatSocket = new WebSocket(url);

        chatSocket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            const chat = document.getElementById('chat');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            // msgDiv.textContent = data.message;
            const dateOptions = { hour: 'numeric', minute: 'numeric', hour12: true };
            const datetime = new Date(data.datetime).toLocaleTimeString('en-US', dateOptions);
            msgDiv.innerHTML = `
            <div class="message-content">
                <div class="message-header">
                    <span class="message-user">${data.user}</span>
                    <span class="message-time">${datetime}</span>
                </div>
                <div class="message-text">${data.message}</div>
            </div>
        `;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        };

        const input = document.getElementById('chat-message-input');
        const submitButton = document.getElementById('chat-message-submit');

        submitButton.addEventListener('click', function (event) {
            const message = input.value;
            if (message) {
                chatSocket.send(JSON.stringify({ 'message': message }));
                input.value = '';
                input.focus();
            }
        });

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                submitButton.click();
            }
        });
    });
</script>

<body>
    <header>
        <div class="user-info">
            <strong>{{ username }}</strong>
            <span style="color: #64748b; font-size: 0.875rem;">Connected to Room {{ room_id }}</span>
        </div>
        <a href="{% url 'chat:logout' %}" class="logout-btn">Logout</a>
    </header>

    <div id="chat">
        {% for message in latest_messages %}
        <div class="message">
            <div class="message-content">
                <div class="message-header">
                    <span class="message-user">{{ message.user.username }}</span>
                    <span class="message-time">{{ message.sent_on|date:"g:i A" }}</span>
                </div>
                <div class="message-text">{{ message.content }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="chat-input">
        <input id="chat-message-input" type="text" placeholder="Type a message...">
        <button id="chat-message-submit">Send</button>
    </div>
</body>

</html>
